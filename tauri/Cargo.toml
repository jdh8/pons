[package]
name = "pons-tauri"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"
description = "Desktop front end for pons: the web UI in a native window, the engine on native threads"

# Standalone crate, like `web/`: its own workspace root, so the parent `pons`
# package never adopts it (and never compiles a GUI toolkit).
[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
# The session API (deal, bid, snapshot, book, settings registry) is the web
# crate's, called as plain Rust: one engine surface, and one UI (`web/`'s
# HTML, embedded at build time).  Its double-dummy paths fan out over
# pons-dds's thread pool on native targets.
pons-web = { path = "../web" }

# Same as the parent crate: an un-optimized solver and bidder are glacial.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
