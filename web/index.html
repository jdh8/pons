<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pons — bridge bidding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>pons</h1>
    <nav>
      <button data-tab="practice">Practice</button>
      <button data-tab="demo">Demo</button>
      <button data-tab="book">Book</button>
      <button data-tab="edit">Edit</button>
      <button data-tab="binky">Evaluate</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>
  <main>
    <section id="practice">
      <div class="controls">
        <label>Seat <select id="p-seat">
          <option>N</option><option>E</option><option selected>S</option><option>W</option>
        </select></label>
        <label>Dealer <select id="p-dealer">
          <option value="rotate" selected>Rotate</option>
          <option>N</option><option>E</option><option>S</option><option>W</option>
        </select></label>
        <label>Vul <select id="p-vul">
          <option value="none" selected>None</option><option value="ns">NS</option>
          <option value="ew">EW</option><option value="both">Both</option>
        </select></label>
        <label>Min HCP <input id="p-hcp" type="number" min="0" max="37" value="0"></label>
        <button id="p-deal" class="primary">Deal</button>
      </div>
      <div id="p-info" class="boardinfo"></div>
      <div class="table-area">
        <div id="p-hand" class="panel hand-panel"><p class="hint">Pick your options and press Deal.</p></div>
        <div id="p-auction" class="panel auction-panel"></div>
      </div>
      <div id="p-bidbox" class="bidbox"></div>
      <label class="hintbar"><input id="p-hint-on" type="checkbox">
        Show the evaluator net's trick estimate for our side</label>
      <div id="p-hint" class="panel hidden"></div>
      <div id="p-feedback" class="panel feedback hidden"></div>
      <div id="p-reveal" class="revealbox hidden"></div>
      <div id="p-oracle" class="panel ddpanel hidden"></div>
      <div id="p-dd" class="panel ddpanel hidden"></div>
    </section>
    <section id="demo" class="hidden">
      <div class="controls">
        <label>Dealer <select id="d-dealer">
          <option selected>N</option><option>E</option><option>S</option><option>W</option>
        </select></label>
        <label>Vul <select id="d-vul">
          <option value="none" selected>None</option><option value="ns">NS</option>
          <option value="ew">EW</option><option value="both">Both</option>
        </select></label>
        <button id="d-deal" class="primary">Deal</button>
        <button id="d-edit" class="secondary" disabled>Edit this deal →</button>
      </div>
      <div id="d-info" class="boardinfo"></div>
      <div id="d-hands"></div>
      <div class="table-area">
        <div id="d-auction" class="panel auction-panel hidden"></div>
      </div>
      <div id="d-dd" class="panel ddpanel hidden"></div>
    </section>
    <section id="book" class="hidden">
      <div class="controls">
        <label>Partnership <select id="b-pair">
          <option value="ns" selected>North–South</option>
          <option value="ew">East–West</option>
        </select></label>
        <input id="b-filter" type="search" placeholder="Filter by auction or rule text…">
        <span id="b-count" class="count"></span>
      </div>
      <div id="b-results"></div>
    </section>
    <section id="edit" class="hidden">
      <div class="controls">
        <input id="e-pbn" type="text" spellcheck="false" placeholder="N:AKQ.… (PBN deal) — type here or click cards below">
        <button id="e-copy" class="secondary">Copy PBN</button>
        <button id="e-random" class="primary">Random</button>
        <button id="e-clear" class="secondary">Clear</button>
        <button id="e-bid" class="primary">Bid it out in Demo →</button>
        <button id="e-eval" class="secondary">Evaluate N-S →</button>
      </div>
      <div id="e-status" class="boardinfo"></div>
      <div id="e-grid" class="editgrid"></div>
      <div id="e-board"></div>
    </section>
    <section id="binky" class="hidden">
      <div class="controls">
        <label>Contract <select id="k-which">
          <option value="binky.json" selected>Notrump</option>
          <option value="binky-suit.json">Best suit</option>
        </select></label>
        <button id="k-from-edit" class="secondary">← Load N-S from Edit</button>
        <button id="k-to-edit" class="secondary">Edit these hands →</button>
      </div>
      <div class="hands-row">
        <label>North <input id="k-north" type="text" spellcheck="false"
          value="AK32.QJ4.T98.762" placeholder="spades.hearts.diamonds.clubs"></label>
        <label>South <input id="k-south" type="text" spellcheck="false"
          value="Q54.AK5.QJ42.A83" placeholder="spades.hearts.diamonds.clubs"></label>
      </div>
      <p id="k-parse" class="hint"></p>
      <div id="k-readout" class="panel"></div>
      <div class="controls">
        <button id="k-verify" class="primary">Verify with double dummy</button>
        <label>Shuffles <select id="k-shuffles">
          <option value="100" selected>100 — interactive</option>
          <option value="1000">1000 — deep</option>
        </select></label>
        <span id="k-progress" class="hint"></span>
      </div>
      <div id="k-verdict" class="panel hidden"></div>
      <div class="panel">
        <h3>The table</h3>
        <p class="hint" id="k-gauge"></p>
        <input id="k-filter" type="text" placeholder="filter holdings, e.g. AK or xxxx" spellcheck="false">
        <div id="k-table" class="tablescroll"></div>
      </div>
    </section>
    <section id="settings" class="hidden">
      <div class="boardinfo">Toggle conventions, then Deal in Practice or Demo — changes apply to the next deal.</div>
      <div class="controls">
        <label>Partnership <select id="s-pair">
          <option value="ns" selected>North–South</option>
          <option value="ew">East–West</option>
        </select></label>
      </div>
      <div id="s-options"></div>
      <button id="s-reset" class="secondary">Reset North–South to defaults</button>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
